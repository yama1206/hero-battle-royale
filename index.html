<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ヒーローバトルロイヤル（試作）</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root { --bg:#10131a; --panel:#1b2030; --line:#2c3450; --text:#e8ecf5; --sub:#8f9ab8; --accent:#ffb347; --ok:#5bd68a; --ng:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #lobby { position:absolute; inset:0; display:flex; padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); overflow-y:auto; touch-action:pan-y; }
  #lobby .card { margin:auto; }
  #safe { position:fixed; visibility:hidden; pointer-events:none; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .card { width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; } .sub { color:var(--sub); font-size:13px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--sub); margin:10px 0 4px; }
  input, select { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:#0d1018; color:var(--text); font-size:16px; user-select:text; -webkit-user-select:text; }
  button { width:100%; margin-top:10px; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#1a1200; font-weight:700; font-size:16px; cursor:pointer; }
  button.sec { background:#2c3450; color:var(--text); }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  #roomInfo { display:none; } .code { font-size:32px; letter-spacing:6px; font-weight:800; color:var(--accent); text-align:center; margin:6px 0; }
  ul { list-style:none; padding:0; margin:8px 0; } li { padding:8px 10px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; font-size:14px; }
  .tag { font-size:12px; color:var(--sub); } #msg { color:var(--ng); font-size:13px; min-height:18px; margin-top:8px; }
  .help { font-size:12px; color:var(--sub); margin-top:12px; line-height:1.6; }
  #game { position:absolute; inset:0; display:none; } canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; left:calc(12px + env(safe-area-inset-left)); top:calc(10px + env(safe-area-inset-top)); font-size:13px; background:rgba(0,0,0,.45); padding:8px 10px; border-radius:8px; pointer-events:none; }
  #timer { position:absolute; left:50%; top:calc(10px + env(safe-area-inset-top)); transform:translateX(-50%); font-size:22px; font-weight:800; background:rgba(0,0,0,.45); padding:4px 14px; border-radius:8px; pointer-events:none; }
  #feed { position:absolute; right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top)); font-size:13px; text-align:right; pointer-events:none; }
  #feed div { background:rgba(0,0,0,.45); padding:3px 8px; border-radius:6px; margin-bottom:4px; }
  #result { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); }
  #result .card { text-align:center; } #resTxt { font-size:24px; font-weight:800; }
</style>
</head>
<body>
<div id="safe"></div><div id="lobby"><div class="card">
  <h1>ヒーローバトルロイヤル</h1><div class="sub">試作 段階3.6：港町ソルティア</div>
  <div id="entry">
    <label>名前</label><input id="name" maxlength="10" placeholder="なまえ">
    <button id="btnHost">部屋を作る</button>
    <label>部屋コード</label>
    <div class="row"><input id="codeIn" maxlength="4" placeholder="ABCD" style="text-transform:uppercase"><button id="btnJoin" class="sec" style="margin-top:0">参加</button></div>
  </div>
  <div id="roomInfo">
    <div class="sub" style="margin:0;text-align:center">部屋コード</div><div class="code" id="codeOut">----</div>
    <div id="mapBox"><label>マップ</label><select id="mapSel"></select></div>
    <div class="sub" id="mapTxt" style="margin:6px 0 0;font-size:12px;line-height:1.5"></div>
    <div id="teamBox"><label>チーム人数</label>
      <select id="teamSel"><option value="1">ソロ</option><option value="2" selected>2人</option><option value="3">3人</option><option value="4">4人</option><option value="5">5人</option></select></div>
    <div class="sub" id="teamTxt" style="margin:8px 0 0"></div>
    <ul id="plist"></ul>
    <button id="btnStart" style="display:none">試合開始（空き枠はBOT）</button>
    <div class="sub" id="waitTxt" style="text-align:center;display:none">ホストの開始を待っています…</div>
  </div>
  <div id="msg"></div>
  <div class="help">操作：コントローラー 左スティック移動・右スティック照準・RTで射撃・Xボタン長押しで蘇生／PC WASD移動・マウス照準・クリック射撃・E長押しで蘇生／スマホ 画面左で移動・画面右で照準＋射撃・右下ボタン長押しで蘇生</div>
</div></div>

<div id="game"><canvas id="cv"></canvas><div id="timer">10:00</div><div id="hud"></div><div id="feed"></div>
  <div id="result"><div class="card"><div id="resTxt"></div><button id="btnLobby" style="display:none">ロビーに戻る</button><div class="sub" id="resWait" style="margin:10px 0 0">ホストがロビーに戻すのを待っています…</div></div></div>
</div>

<script>
// ===== 設定 =====
const MAX_PLAYERS = 5;
let MAP = 16000;   // マップの広さ（マップを読み込むと変わる）
const MATCH_SEC = 600, PREFIX = 'hbr-room-';
const R = 13, SPEED = 220;
// ---- ここから下の数値は試作用の仮（未決定・あとで差し替え） ----
const GUN = { rate:0.15, speed:900, dmg:12, range:700 };
const CRAWL = 60;                    // ダウン中の這う速度
const DOWN_HP = 100;                 // ダウン中の体力
const DOWN_SHIELD = 200;             // ダウンシールド耐久（仕様：ノーマル200。レアリティで変わるのは後で）
const DSHIELD_ARC = Math.PI/3;       // ダウンシールドの守る範囲（左右60°）
const BLEED = [60, 50, 40, 30];      // ダウン回数ごとの完全脱落までの猶予(秒)（仕様で確定）
const REVIVE_SEC = 5;                // 蘇生にかかる長押し時間
const REVIVE_RANGE = 50;
const REVIVE_HP = 30;                // 蘇生後のHP（シールドは0）
const REVIVE_INV = 2000;             // 蘇生直後の無敵(ms)。無敵中は攻撃できない（仕様で確定）
const ENGAGE_MS = 10000;             // BOTの攻撃許可が続く時間
const BOT_SPREAD = 0.12;
const ZOOM = 0.8;                    // 画面の拡大率（小さいほど広く見える）
// ----------------------------------------------------------------
const COLORS = ['#ffb347','#5bc0ff','#ff6b9a','#7be07b','#c89bff'];

// ===== 見た目（斜め見下ろし）とスキン =====
// ゲームの中身（移動・弾・当たり判定）は足元の位置で計算し、描くときだけ立体的に見せる
const CHAR_SCALE = 0.7; // キャラの表示の大きさ（1でもとの大きさ）
const BODY_H = 22*CHAR_SCALE; // 体の中心（銃を構える高さ）。弾もこの高さで描く
const WALL_H = 46;      // 障害物の高さ（見た目だけ）
const SPRITE_W = 48, SPRITE_H = 64;   // キャラ画像の表示サイズ（足元が画像の下端中央）
// キャラ画像に差し替えるとき：ここに書くだけでOK。横向きは「右向き」1枚（左向きは自動で反転）
//   例） hero1: { front:'skins/hero1/front.png', back:'skins/hero1/back.png', side:'skins/hero1/side.png' }
// 画像がない・読み込めないスキンは仮の絵で表示されます
const SKINS = {
  default: null,
};
const skinCache = {};
function skinImg(skin, dir){
  const def = SKINS[skin]; if (!def || !def[dir]) return null;
  const key = skin+'/'+dir; let im = skinCache[key];
  if (!im) { im = skinCache[key] = new Image(); im.src = def[dir]; }
  return im.complete && im.naturalWidth ? im : null;
}
const dirOf = (ax, ay) => Math.abs(ax) > Math.abs(ay)*1.2 ? (ax<0?'left':'right') : (ay<0?'back':'front');
const BOT_NAMES = ['アルファ','ブラボー','チャーリー','デルタ','エコー','フォックス','ゴルフ','ホテル'];

// ===== マップ =====
// マップはデータで書く：名前・設定・広さ・エリア・建物配置（gen）。増やすときは MAPS に足すだけ（ロビーの選択肢にも出る）
// 配置は固定シードの自動生成なので全員同じ町になる。手直しは fixed（追加）と remove（消す範囲 [x,y,幅,高さ]）に書く
//   fixed の例） { k:'crate', x:8000, y:12000, w:34, h:30, ht:30 }
const MAPS = {
  soltia: {
    name:'港町ソルティア',
    story:'交易で栄えた港町。ヒーロー大会の会場に選ばれ住民は避難し、運営の物資箱だけが残る。南は海（入れない）、北は丘。',
    size:16000, seed:20261106,
    // エリア（後ろに書いたものが優先）。loot＝物資の量（物資箱を入れたときに使う）
    areas:[
      { id:'north',    name:'北のはずれ',     g:'grass',    r:[0,0,16000,1800],        loot:'少' },
      { id:'west',     name:'西の野原',       g:'grass',    r:[0,1800,2700,8000],      loot:'少' },
      { id:'hill',     name:'丘の住宅街',     g:'grass2',   r:[2700,1800,10900,3040],  loot:'中' },
      { id:'easthill', name:'東の丘',         g:'grass',    r:[13600,1800,2400,3040],  loot:'少' },
      { id:'craft',    name:'職人通り',       g:'cobble',   r:[2880,5030,2370,4960],   loot:'少' },
      { id:'old',      name:'旧市街',         g:'cobble',   r:[5410,5030,5370,4960],   loot:'多' },
      { id:'ware',     name:'倉庫通り',       g:'concrete', r:[10940,5030,2310,4960],  loot:'少' },
      { id:'ship',     name:'造船所',         g:'concrete', r:[13430,5030,2570,11000], loot:'多' },
      { id:'cape',     name:'灯台の岬',       g:'rock',     r:[0,9800,2700,6200],      loot:'中' },
      { id:'market',   name:'魚市場',         g:'quay',     r:[2880,10310,2370,5700],  loot:'中' },
      { id:'pier',     name:'大桟橋',         g:'quay',     r:[5410,10310,5370,5700],  loot:'多' },
      { id:'yard',     name:'コンテナヤード', g:'concrete', r:[10940,10310,2310,5700], loot:'多' },
    ],
    fixed:[], remove:[],
    gen: genSoltia,
  },
};
let W = null; // 今のマップ（建物・道・水など）
const world = () => W;
const HC = 400; // 当たり判定・描画用のマス目の大きさ
const inR = (r,x,y) => x>=r[0] && x<r[0]+r[2] && y>=r[1] && y<r[1]+r[3];
const sstep = (a,b,x) => { const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };
const h2 = (x,y) => { let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; };
function mulberry(a){ return () => { a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  if (f<0){ r*=1+f; g*=1+f; b*=1+f; } else { r+=(255-r)*f; g+=(255-g)*f; b+=(255-b)*f; } return `rgb(${r|0},${g|0},${b|0})`; }
function hIns(hs,o){ for (let i=Math.floor(o.bx/HC); i<=Math.floor((o.bx+o.bw)/HC); i++) for (let j=Math.floor(o.by/HC); j<=Math.floor((o.by+o.bh)/HC); j++){ const k=i+j*4096; let a=hs.get(k); if(!a) hs.set(k,a=[]); a.push(o); } }
let qStamp = 0;
function hQuery(hs,x0,y0,x1,y1,out){ qStamp++; out=out||[];
  for (let i=Math.floor(x0/HC); i<=Math.floor(x1/HC); i++) for (let j=Math.floor(y0/HC); j<=Math.floor(y1/HC); j++){ const a=hs.get(i+j*4096); if(!a) continue;
    for (const o of a){ if (o._q===qStamp) continue; o._q=qStamp; out.push(o); } } return out; }
// 障害物（ぶつかる物）。ht＝見た目の高さ、low＝低い物（弾は上を通る）、top＝絵が上にはみ出す長さ
function addObs(o){ o.ht=o.ht||0; if (o.top===undefined) o.top=o.ht; o.bx=o.x; o.by=o.y; o.bw=o.w; o.bh=o.h;
  if (!o.ib) o.ib=[o.x-6, o.y-o.top-6, o.w+12, o.h+o.top+12]; W.obs.push(o); hIns(W.hash,o); return o; }
// 飾り（ぶつからない物：街灯・船・クレーン・船の骨組みなど）
function addDeco(d){ W.decor.push(d); hIns(W.dhash,d); return d; }
function areaAt(x,y){ for (let i=W.areas.length-1;i>=0;i--) if (inR(W.areas[i].r,x,y)) return W.areas[i]; return null; }
function buildWorld(id){
  const def = MAPS[id] || MAPS.soltia; MAP = def.size;
  W = { id: MAPS[id]?id:'soltia', def, areas:def.areas, obs:[], decor:[], roads:[], canals:[], bridges:[], docks:[], grects:[], gdecor:[], lateRoofs:[],
        hash:new Map(), dhash:new Map(), chunks:new Map(), shoreY:()=>1e9, lh:null };
  def.gen(W, def, mulberry(def.seed));
  for (const f of def.fixed||[]) addObs(Object.assign({}, f));
  if ((def.remove||[]).length) { const hit = o => def.remove.some(r => o.x<r[0]+r[2] && o.x+o.w>r[0] && o.y<r[1]+r[3] && o.y+o.h>r[1]);
    W.obs = W.obs.filter(o=>!hit(o)); W.hash = new Map(); for (const o of W.obs) hIns(W.hash,o); }
}

function genSoltia(W, def, rnd){
  const S=def.size, ri=(a,b)=>a+rnd()*(b-a), pick=a=>a[rnd()*a.length|0];
  // 海岸線：南が海。西の端（灯台の岬）は海に突き出る
  W.shoreY = x => { const t=sstep(3300,2100,x); return 13000 + Math.sin(x*0.0021)*45 + Math.sin(x*0.00063+1.3)*100 + t*(1500+Math.sin(x*0.004)*80); };
  // 道路（g：見た目の種類）
  const road=(x,y,w,h,g='road')=>W.roads.push({r:[x,y,w,h],g});
  road(0,4840,S,190);                                   // 丘と町を分ける大通り
  road(7935,0,130,1800,'dirt'); road(7900,1800,200,11400); // 北の畑から大桟橋へまっすぐ
  road(2700,4840,180,8300); road(13250,4840,180,8200);  // 西の通り・東の通り
  road(2880,6200,10370,140); road(2880,8900,10370,140); // 旧市街の横の通り
  road(6600,5030,140,4960); road(9400,5030,140,4960);   // 旧市街の縦の通り
  road(2880,9990,10370,160); road(2880,10310,10370,150); road(2880,11700,10370,150); // 運河沿い・港通り
  for (const x of [3900,6100,9050,10050,12100]) road(x,10150,100,160); // 運河の小さな橋
  road(2880,2480,10720,120); road(2880,3700,10720,120); // 丘の坂道
  road(0,900,S,100,'dirt'); for (const x of [4200,6300,9700,11800]) road(x,1800,100,3040,'dirt');
  road(1205,9800,100,3780,'dirt'); road(1305,11000,1395,100,'dirt'); // 灯台への小道
  // 運河（町を区切る）。道と交わるところは自動で橋になる
  W.canals.push([2880,10150,10370,160],[5250,5030,160,8300],[10780,5030,160,8300]);
  for (const c of W.canals) for (const {r} of W.roads) { const x0=Math.max(c[0],r[0]), y0=Math.max(c[1],r[1]), x1=Math.min(c[0]+c[2],r[0]+r[2]), y1=Math.min(c[1]+c[3],r[1]+r[3]);
    if (x1>x0 && y1>y0) W.bridges.push([x0,y0,x1-x0,y1-y0]); }
  // 海の上を歩ける場所（桟橋・岸壁・船台）
  W.docks.push({r:[7550,12600,900,2700],g:'wood'},{r:[6800,14250,750,180],g:'wood'},{r:[8450,13700,750,180],g:'wood'},
               {r:[3850,12500,260,1300],g:'wood'},{r:[11000,12600,2100,700],g:'concrete'});
  const SLIPS=[13700,14450,15200]; for (const sx of SLIPS) W.docks.push({r:[sx,10900,460,3000],g:'slip'});

  const blocked=[];
  function free(r,m,ignore){ const [x,y,w,h]=r; if (x<m||y<m||x+w>S-m||y+h>S-m) return false;
    const hit=q=>!(x+w+m<=q[0]||x-m>=q[0]+q[2]||y+h+m<=q[1]||y-m>=q[1]+q[3]);
    for (const rd of W.roads) if (hit(rd.r)) return false; for (const c of W.canals) if (hit(c)) return false;
    if (!ignore) for (const b of blocked) if (hit(b)) return false;
    const e=Math.min(m,40); for (const [px,py] of [[x-e,y-e],[x+w+e,y-e],[x-e,y+h+e],[x+w+e,y+h+e],[x+w/2,y+h/2]]) if (wetAt(px,py)) return false;
    for (const o of hQuery(W.hash,x-m,y-m,x+w+m,y+h+m)) if (!(x+w+m<=o.x||x-m>=o.x+o.w||y+h+m<=o.y||y-m>=o.y+o.h)) return false;
    return true; }
  // 予約地（自動生成で建物を置かない場所）
  const PLAZA=[7350,7050,1300,1000], HALL=[3150,10600,1800,900];
  W.grects.push({r:PLAZA,g:'plaza'});
  blocked.push(PLAZA,[HALL[0]-50,HALL[1]-40,HALL[2]+100,HALL[3]+90],[7500,12550,1000,2800],[3830,12450,300,1400],[10990,12620,2200,700]);
  for (const sx of SLIPS) blocked.push([sx-20,10850,500,3100]);
  // 畑
  for (let i=0;i<60;i++){ const w=ri(600,1300), h=ri(300,650), north=i<40, x=north?ri(150,S-w-150):ri(100,2550-w), y=north?ri(80,1750-h):ri(1950,9500-h), r=[x,y,w,h];
    if (free(r,40)) { W.grects.push({r,g:rnd()<.5?'fieldG':'fieldW'}); blocked.push(r); } }

  const OLDW=['#efe4cf','#e8d6b0','#f3efe6','#e6c9b8','#d9cfbd','#cfd8d6','#f0dcb4'], OLDR=['#b5523b','#c46a3c','#9c4535','#5d6b7a','#7a5a48','#4f7f8c','#c08a3e'];
  const HILW=['#f4efe2','#e9f0f2','#f2e3d0','#e2ecd9','#f5e1e1','#efe8d8'], HILR=['#4f7f8c','#c46a3c','#7a5a48','#5d6b7a','#a94a3a','#6f8f5a'];
  const WHW=['#9aa3a8','#b5a48a','#8c9c8f','#a88f7a','#7f8fa3'], WHR=['#6d747a','#7b5e4f','#5b6b74','#857a6a'];
  const AWN=['#c8402e','#2f6fb8','#3c8d4a','#d1822b','#8a4fa0'];
  const bld=(x,y,w,h,ht,W0,R0,extra)=>{ const wall=pick(W0), roof=pick(R0);
    return addObs(Object.assign({k:'bld',x,y,w,h,ht,cW:wall,cWd:shade(wall,-.2),cRl:shade(roof,.1),cRd:shade(roof,-.12),cRline:shade(roof,-.35),
      door:rnd()<.75, chim:rnd()<.3, seed:rnd()*1e9|0}, extra||{})); };
  const wh=(x,y,w,h,ht)=>{ const wall=pick(WHW), roof=pick(WHR); return addObs({k:'wh',x,y,w,h,ht,cW:wall,cWd:shade(wall,-.18),cRl:roof,cRd:shade(roof,-.2)}); };

// ===== 当たり判定 =====
// 水（海・運河）は入れない。桟橋・橋の上は歩ける
function wetAt(x,y){ if (x<0||y<0||x>MAP||y>MAP) return true;
  if (y > W.shoreY(x)) { for (const d of W.docks) if (inR(d.r,x,y)) return false; return true; }
  for (const c of W.canals) if (inR(c,x,y)) { for (const b of W.bridges) if (inR(b,x,y)) return false; return true; }
  return false; }
const wetFoot = (x,y) => wetAt(x,y)||wetAt(x+R*.8,y)||wetAt(x-R*.8,y)||wetAt(x,y+R*.5)||wetAt(x,y-R*.5);
const _near = [];
function pushOut(p, px, py){
  _near.length = 0; hQuery(W.hash, p.x-R, p.y-R, p.x+R, p.y+R, _near);
  for (const o of _near) {
    const nx = Math.max(o.x, Math.min(p.x, o.x+o.w)), ny = Math.max(o.y, Math.min(p.y, o.y+o.h));
    const dx = p.x-nx, dy = p.y-ny, d = Math.hypot(dx,dy);
    if (d < R) { if (d===0) { p.y = o.y - R; } else { p.x = nx + dx/d*R; p.y = ny + dy/d*R; } }
  }
  p.x = Math.max(R, Math.min(MAP-R, p.x)); p.y = Math.max(R, Math.min(MAP-R, p.y));
  if (px!==undefined && wetFoot(p.x,p.y) && !wetFoot(px,py)) { // 水に入ろうとしたら、入らない方向だけ動く
    if (!wetFoot(p.x,py)) p.y = py; else if (!wetFoot(px,p.y)) p.x = px; else { p.x = px; p.y = py; } }
}
function inObs(x,y){ const a = W.hash.get(Math.floor(x/HC)+Math.floor(y/HC)*4096); if (!a) return false;
  for (const o of a) if (!o.low && x>o.x && x<o.x+o.w && y>o.y && y<o.y+o.h) return true; return false; }
const spotOK = (x,y) => x>R && y>R && x<MAP-R && y<MAP-R && !wetFoot(x,y) &&
  !hQuery(W.hash,x-R-4,y-R-4,x+R+4,y+R+4).some(o=>x>o.x-R&&x<o.x+o.w+R&&y>o.y-R&&y<o.y+o.h+R);
function freeSpot(cx, cy, rad){ for (let i=0;i<300;i++){ const x = cx===undefined ? 200+Math.random()*(MAP-400) : cx+(Math.random()*2-1)*rad, y = cy===undefined ? 200+Math.random()*(MAP-400) : cy+(Math.random()*2-1)*rad;
    if (spotOK(x,y)) return {x,y}; } return cx===undefined ? {x:8000,y:7300} : freeSpot(cx, cy, rad*1.5+50); }
function losClear(a,b){ const n = Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/20); for(let i=1;i<n;i++){ if(inObs(a.x+(b.x-a.x)*i/n, a.y+(b.y-a.y)*i/n)) return false; } return true; }

// ===== 入力（自分） =====
const keys = {}; let mouse = { x:0, y:0, down:false, used:false };
const touch = { move:null, aim:null, act:null };
const SAFE = { t:0, r:0, b:0, l:0 }; // ノッチなどで隠れる端の幅
const actBtn = () => ({ x:innerWidth-80-SAFE.r, y:innerHeight-(innerWidth>innerHeight?120:170)-SAFE.b, r:38 }); // 横画面では少し下に
addEventListener('keydown', e => keys[e.code]=true); addEventListener('keyup', e => keys[e.code]=false);
addEventListener('mousemove', e => { mouse.x=e.clientX; mouse.y=e.clientY; mouse.used=true; });
addEventListener('mousedown', e => { if(e.button===0) mouse.down=true; }); addEventListener('mouseup', () => mouse.down=false);
function tStart(e){ for (const t of e.changedTouches) { const b=actBtn();
    if (Math.hypot(t.clientX-b.x, t.clientY-b.y) < b.r+10) { touch.act = { id:t.identifier }; continue; }
    const side = t.clientX < innerWidth/2 ? 'move':'aim';
    if (!touch[side]) touch[side] = { id:t.identifier, ox:t.clientX, oy:t.clientY, x:t.clientX, y:t.clientY }; } e.preventDefault(); }
function tMove(e){ for (const t of e.changedTouches) for (const k of ['move','aim']) if (touch[k]&&touch[k].id===t.identifier){ touch[k].x=t.clientX; touch[k].y=t.clientY; } e.preventDefault(); }
function tEnd(e){ for (const t of e.changedTouches) for (const k of ['move','aim','act']) if (touch[k]&&touch[k].id===t.identifier) touch[k]=null; e.preventDefault(); }
const stickOf = t => { if(!t) return {x:0,y:0}; let x=(t.x-t.ox)/60, y=(t.y-t.oy)/60; const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;} return {x,y}; };
const dz = v => Math.abs(v) < 0.2 ? 0 : v;

let lastAim = { x:1, y:0 };
function readInput(me){
  let mx=0, my=0, ax=0, ay=0, fire=false, assist=false, act=!!keys.KeyE || !!touch.act;
  if (keys.KeyW||keys.ArrowUp) my-=1; if (keys.KeyS||keys.ArrowDown) my+=1;
  if (keys.KeyA||keys.ArrowLeft) mx-=1; if (keys.KeyD||keys.ArrowRight) mx+=1;
  if (mouse.used && me) { ax = mouse.x - innerWidth/2; ay = mouse.y - innerHeight/2; fire = mouse.down; }
  const gp = (navigator.getGamepads ? [...navigator.getGamepads()] : []).find(g=>g);
  if (gp) { const lx=dz(gp.axes[0]), ly=dz(gp.axes[1]), rx=dz(gp.axes[2]||0), ry=dz(gp.axes[3]||0);
    if (lx||ly) { mx=lx; my=ly; } if (rx||ry) { ax=rx; ay=ry; assist=true; }
    if ((gp.buttons[7]&&gp.buttons[7].value>0.3) || (gp.buttons[5]&&gp.buttons[5].pressed)) { fire=true; assist=true; }
    if (gp.buttons[2]&&gp.buttons[2].pressed) act=true; }
  if (touch.move) { const s=stickOf(touch.move); mx=s.x; my=s.y; }
  if (touch.aim) { const s=stickOf(touch.aim); if (Math.hypot(s.x,s.y)>0.2){ ax=s.x; ay=s.y; fire = true; assist=true; } }
  const m = Math.hypot(mx,my); if (m>1){ mx/=m; my/=m; }
  if (ax||ay) { const a=Math.hypot(ax,ay); lastAim={x:ax/a,y:ay/a}; }
  else if (!mouse.used && Math.hypot(mx,my)>0.2) { const a=Math.hypot(mx,my); lastAim={x:mx/a,y:my/a}; } // 照準していないときは移動方向を向く
  let aim = lastAim;
  if (assist && me) aim = aimAssist(me, aim);
  return { mx, my, ax:aim.x, ay:aim.y, fire, act };
}
function aimAssist(me, aim){
  const mp = state.players.find(p=>p.id===myId); if (!mp) return aim;
  let best=null, bd=1e9;
  for (const p of state.players) { if (p.out || teamOf(p.slot)===teamOf(mp.slot)) continue;
    const dx=p.x-me.x, dy=p.y-me.y, d=Math.hypot(dx,dy); if (d>GUN.range||d<1) continue;
    const ang = Math.acos(Math.max(-1,Math.min(1,(dx*aim.x+dy*aim.y)/d))); if (ang < 0.44 && d<bd){ bd=d; best={x:dx/d,y:dy/d}; } }
  if (!best) return aim; const x=aim.x+best.x, y=aim.y+best.y, m=Math.hypot(x,y)||1; return {x:x/m,y:y/m};
}

// ===== 自分の移動 =====
let local = null, lastT = performance.now(), sendAcc = 0;
function localStep(dt){
  const me = state.players.find(p=>p.id===myId); if (!me) return null;
  if (!local || local.rs !== me.rs) local = { x:me.x, y:me.y, rs:me.rs };
  const inp = readInput(local);
  if (!me.out) { const sp = me.down ? CRAWL : SPEED, ox = local.x, oy = local.y; local.x += inp.mx*sp*dt; local.y += inp.my*sp*dt; pushOut(local, ox, oy); }
  local.ax = inp.ax; local.ay = inp.ay; local.fire = inp.fire && alive(me); local.act = inp.act && alive(me); local.id = myId;
  return local;
}

// ===== ホスト =====
function startHost(){
  roomCode = genCode(); isHost = true;
  peer = new Peer(PREFIX + roomCode);
  peer.on('open', id => { myId = id; state.players = [{ id, name:myName(), bot:false, slot:0 }]; showRoom(); });
  peer.on('connection', c => {
    c.on('open', () => {
      if (state.phase!=='lobby' || state.players.filter(p=>!p.bot).length >= MAX_PLAYERS) {
        c.send({ t:'reject', reason: state.phase!=='lobby' ? '試合中です' : '満員です' }); setTimeout(()=>c.close(),300); return; }
      conns[c.peer] = c;
    });
    c.on('data', d => {
      if (d.t==='hello') { const used=state.players.map(p=>p.slot); let slot=0; while(used.includes(slot)) slot++;
        state.players.push({ id:c.peer, name:String(d.name).slice(0,10), bot:false, slot }); renderList(); broadcast(); }
      else if (d.t==='in') inputs[c.peer] = d;
    });
    c.on('close', () => onLeave(c.peer)); c.on('error', () => onLeave(c.peer));
  });
  peer.on('error', e => { if (e.type==='unavailable-id'){ peer.destroy(); startHost(); } else msg('接続エラー：'+e.type); });
}
function onLeave(pid){
  if (!conns[pid]) return; delete conns[pid]; delete inputs[pid];
  const p = state.players.find(p=>p.id===pid); if (!p) return;
  if (state.phase==='lobby') state.players = state.players.filter(x=>x.id!==pid);
  else { p.bot = true; p.left = true; p.name += '(BOT)'; feed(`${p.name} がBOTに交代`); }
  renderList(); broadcast();
}
function hostStartMatch(){
  state.teamSize = +$('teamSel').value;
  const names = BOT_NAMES.filter(n=>!state.players.some(p=>p.name===n)).sort(()=>Math.random()-.5);
  for (let s=0;s<MAX_PLAYERS;s++) if (!state.players.some(p=>p.slot===s)) state.players.push({ id:'bot'+s, name:names.pop(), bot:true, slot:s });
  // チームごとにまとまって配置
  const nTeams = Math.ceil(MAX_PLAYERS/state.teamSize), base = [];
  const a0 = Math.random()*Math.PI*2;
  for (let t=0;t<nTeams;t++){ const a=a0+t/nTeams*Math.PI*2; base.push(freeSpot(8000+Math.cos(a)*1400, 7550+Math.sin(a)*1400, 300)); } // 仮：旧市街のまわりに出現
  state.players.forEach(p => { const b=base[teamOf(p.slot)], s=freeSpot(b.x, b.y, 90);
    Object.assign(p, { skin:p.skin||'default', x:s.x, y:s.y, ax:1, ay:0, hp:100, sh:100, down:false, out:false, downs:0, rs:0, cd:0, kills:0, rv:0, dhp:0, dsh:0, wp:null }); });
  for (const k in engaged) delete engaged[k];
  state.phase='match'; state.startAt=Date.now(); state.winner=null; state.bullets=[]; feeds=[]; state.feed=[];
  broadcast(); enterGame();
}
function hostBackToLobby(){
  state.players = state.players.filter(p=>!p.bot);
  state.phase='lobby'; state.bullets=[]; broadcast(); showLobby();
}
let bulletId = 0;
function hostTick(dt){
  const now = Date.now();
  if (state.phase !== 'match') return;
  for (const p of state.players) {
    if (p.out) continue;
    let inp = p.id===myId ? local : p.bot ? botThink(p, dt) : inputs[p.id];
    if (!inp) continue;
    const sp = p.down ? CRAWL : SPEED;
    const ox = p.x, oy = p.y;
    if (p.bot) { p.x += inp.mx*sp*dt; p.y += inp.my*sp*dt; pushOut(p, ox, oy); }
    else if (inp.x!==undefined) {
      const dx=inp.x-p.x, dy=inp.y-p.y, d=Math.hypot(dx,dy), lim=sp*0.5+20;
      if (d<=lim){ p.x=inp.x; p.y=inp.y; } else { p.x+=dx/d*lim; p.y+=dy/d*lim; } pushOut(p, ox, oy); }
    p.ax = inp.ax; p.ay = inp.ay; // ダウン中はこの向きがダウンシールドの向き
    p.cd -= dt; p.reviving = false;
    if (p.down) { if (now >= p.bleedAt) eliminate(p, '時間切れ'); continue; }
    // 蘇生（長押し）：近くのダウンした味方
    if (inp.act) { const tgt = state.players.find(q=>q.down && !q.out && teamOf(q.slot)===teamOf(p.slot) && Math.hypot(q.x-p.x,q.y-p.y)<REVIVE_RANGE);
      if (tgt) { p.reviving = true; tgt.rvTick = now; tgt.rv += dt/REVIVE_SEC;
        if (tgt.rv >= 1) { Object.assign(tgt, { down:false, hp:REVIVE_HP, sh:0, rv:0, inv:now+REVIVE_INV }); feed(`${p.name} が ${tgt.name} を蘇生`); }
        continue; } }
    if (inp.fire && p.cd <= 0 && !((p.inv||0) > now)) { p.cd = GUN.rate;
      if (!p.bot) engaged[teamOf(p.slot)] = now + ENGAGE_MS; // 人間が攻撃を始めた → 同じチームのBOTも撃ってよい
      state.bullets.push({ id:bulletId++, o:p.id, tm:teamOf(p.slot), x:p.x+p.ax*(R+4), y:p.y+p.ay*(R+4), vx:p.ax*GUN.speed, vy:p.ay*GUN.speed, life:GUN.range/GUN.speed }); }
  }
  for (const p of state.players) if (p.down && p.rv>0 && now-(p.rvTick||0) > 150) p.rv = 0; // 長押しをやめたら最初から
  for (const b of state.bullets) {
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (inObs(b.x,b.y) || b.x<0||b.y<0||b.x>MAP||b.y>MAP) { b.life=0; continue; }
    for (const p of state.players) { if (p.out || teamOf(p.slot)===b.tm) continue; // 味方の弾はすり抜ける
      if (Math.hypot(p.x-b.x, p.y-b.y) < R) { b.life=0; damage(p, GUN.dmg, b, now); break; } }
  }
  state.bullets = state.bullets.filter(b=>b.life>0);

  const live = new Set(state.players.filter(p=>!p.out).map(p=>teamOf(p.slot)));
  if (live.size <= 1 && !state.winner) { const t=[...live][0];
    state.winner = t===undefined ? 'なし' : state.players.filter(p=>teamOf(p.slot)===t).map(p=>p.name).join('・'); state.phase='end'; }
}
function damage(p, dmg, b, now){
  if ((p.inv||0) > now) return; // 蘇生直後の無敵
  engaged[teamOf(p.slot)] = now + ENGAGE_MS; // 撃たれた → そのチームのBOTも撃ってよい
  p.lastHitBy = b.o; p.hitAt = now;
  if (p.down) { // ダウンシールド：向いている方向から来た弾を防ぐ
    if (p.dsh > 0) { const d = Math.hypot(b.vx,b.vy), dot = -(b.vx*p.ax + b.vy*p.ay)/d;
      if (dot > Math.cos(DSHIELD_ARC)) { p.dsh = Math.max(0, p.dsh-dmg); return; } }
    p.dhp -= dmg; if (p.dhp <= 0) eliminate(p, killerName(b.o)+' がとどめ'); return;
  }
  const s = Math.min(p.sh, dmg); p.sh -= s; p.hp -= (dmg - s); // シールドが先に減る
  if (p.hp <= 0) {
    p.hp=0; p.down=true; p.dhp=DOWN_HP; p.dsh=DOWN_SHIELD; p.rv=0;
    p.bleedAt = now + BLEED[Math.min(p.downs, BLEED.length-1)]*1000; p.downs++; // ダウンするたび猶予が短くなる
    const k = state.players.find(x=>x.id===b.o); if (k) k.kills++;
    feed(`${killerName(b.o)} → ${p.name} ダウン`);
    // 仮：チーム全員がダウン（またはソロでダウン）したら、蘇生できる人がいないのでチーム全員脱落
    const mates = state.players.filter(q=>teamOf(q.slot)===teamOf(p.slot) && !q.out);
    if (!mates.some(alive)) mates.forEach(q=>eliminate(q, '全員ダウン'));
  }
}
const killerName = id => { const k=state.players.find(x=>x.id===id); return k?k.name:'?'; };
function eliminate(p, why){ if (p.out) return; p.out=true; p.down=false; feed(`${p.name} 脱落（${why}）`); }

// BOT（仮）
// 自分の画面に見えている範囲（中心からの半分の幅・高さ、世界の大きさで）
const myView = () => ({ w:Math.round(innerWidth/ZOOM/2), h:Math.round(innerHeight/ZOOM/2) });
// BOTは、相手（人間）の画面に自分が映っているときだけ撃つ
function seenBy(q, p){ if (q.bot) return true; const v = q.id===myId ? myView() : (inputs[q.id]&&inputs[q.id].vw ? {w:inputs[q.id].vw,h:inputs[q.id].vh} : {w:300,h:300});
  return Math.abs(p.x-q.x) < v.w-20 && Math.abs(p.y-q.y) < v.h-20; }
function botThink(p, dt){
  const now = Date.now(), myTeam = teamOf(p.slot);
  const mates = state.players.filter(q=>q!==p && teamOf(q.slot)===myTeam && !q.out);
  const humanMate = mates.find(q=>!q.bot && alive(q));
  const humanTeam = state.players.some(q=>teamOf(q.slot)===myTeam && !q.bot);
  p.th = (p.th||0) - dt;
  if (p.th <= 0) { p.th = 0.3; // 判断は一定間隔で更新
    let tgt=null, bd=GUN.range*0.9;
    for (const q of state.players) { if (q.out || teamOf(q.slot)===myTeam) continue;
      const d=Math.hypot(q.x-p.x,q.y-p.y); if (d<bd && seenBy(q,p) && losClear(p,q)){ bd=d; tgt=q; } }
    if (p.lastHitBy && now-p.hitAt<2000) { const q=state.players.find(x=>x.id===p.lastHitBy); if (q&&!q.out&&seenBy(q,p)) tgt=q; }
    // 攻撃開始ルール：人間がいるチームのBOTは、許可が出るまで撃たない
    const mayShoot = !humanTeam || (engaged[myTeam]||0) > now;
    p.tgt = tgt && mayShoot ? tgt.id : null;
    p.revTgt = null;
    const dm = mates.find(q=>q.down);
    if (dm && !p.down && (!tgt || Math.hypot(dm.x-p.x,dm.y-p.y) < 300)) p.revTgt = dm.id; // 味方の蘇生を優先
    if (humanMate) { const a=p.slot*2.1; p.wp = { x:humanMate.x+Math.cos(a)*70, y:humanMate.y+Math.sin(a)*70 }; } // 人間の味方に追従
    else { // 近くをうろうろ。引っかかって動けなければ行き先を変える
      p._st = (p._st||0) + 1; if (p._st >= 4) { p._st = 0; if (Math.hypot(p.x-(p._sx??p.x+99), p.y-(p._sy??p.y)) < 40) p.wp = null; p._sx = p.x; p._sy = p.y; }
      if (!p.wp || Math.hypot(p.wp.x-p.x,p.wp.y-p.y)<40 || Math.random()<0.03) p.wp = freeSpot(p.x, p.y, 1200); }
  }
  const tgt = state.players.find(q=>q.id===p.tgt && !q.out);
  const rev = state.players.find(q=>q.id===p.revTgt && q.down);
  let goal = rev ? rev : p.wp;
  let mx=goal.x-p.x, my=goal.y-p.y, m=Math.hypot(mx,my);
  if (m < (rev ? REVIVE_RANGE*0.6 : 20)) { mx=0; my=0; } else { mx/=m; my/=m; }

  else if (tgt && seenBy(tgt,p)) { const a = Math.atan2(tgt.y-p.y, tgt.x-p.x) + (Math.random()-.5)*2*BOT_SPREAD; ax=Math.cos(a); ay=Math.sin(a); fire=true; mx*=0.5; my*=0.5; }
  if (!fire && (mx||my)) { const a=Math.hypot(mx,my); ax=mx/a; ay=my/a; } // 撃っていないときは移動方向を向く
  if (p.down) { fire=false; act=false; }

}
let feeds = [];
function feed(t){ feeds.push({ t, at:Date.now() }); state.feed = feeds.slice(-5); }
function broadcast(){

    players: state.players.map(p=>({ id:p.id, name:p.name, bot:p.bot, slot:p.slot, skin:p.skin, x:Math.round(p.x), y:Math.round(p.y), ax:+(p.ax||1).toFixed(2), ay:+(p.ay||0).toFixed(2),
      hp:p.hp, sh:p.sh, down:p.down, out:p.out, rs:p.rs, kills:p.kills, dhp:p.dhp, dsh:p.dsh, rv:+(p.rv||0).toFixed(2), bl:p.down?Math.max(0,(p.bleedAt-now)/1000|0):0 })),
    bullets: state.bullets.map(b=>[Math.round(b.x),Math.round(b.y),Math.round(b.vx),Math.round(b.vy)]) };

// ===== 参加者 =====
function startJoin(){
  roomCode = $('codeIn').value.trim().toUpperCase();
  if (roomCode.length!==4) return msg('部屋コードは4文字です');
  peer = new Peer();
  peer.on('open', id => {
    myId = id; hostConn = peer.connect(PREFIX+roomCode, { reliable:true });
    const to = setTimeout(()=>msg('部屋が見つかりません'), 8000);
    hostConn.on('open', () => { clearTimeout(to); hostConn.send({ t:'hello', name:myName() }); showRoom(); });
    hostConn.on('data', d => {
      if (d.t==='reject') { msg(d.reason); return; }
      if (d.t==='state') {
        clockOffset = d.now - Date.now(); const before = state.phase;
        const prev = {}; for (const p of state.players) prev[p.id] = p;
        state = d.s; state.bullets = d.s.bullets.map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3]}));
        if (state.map && W.id !== state.map) buildWorld(state.map);
        for (const p of state.players) { const o=prev[p.id]; const keep = o && o.dx!==undefined && o.rs===p.rs; p.dx=keep?o.dx:p.x; p.dy=keep?o.dy:p.y; }
        if (before==='lobby' && state.phase==='match') { local=null; enterGame(); }
        else if (before!=='lobby' && state.phase==='lobby') showLobby();
        else if (state.phase==='lobby') renderList();
      }
    });
    hostConn.on('close', () => msg('ホストとの接続が切れました'));
  });
  peer.on('error', e => msg(e.type==='peer-unavailable' ? '部屋が見つかりません' : '接続エラー：'+e.type));
}

  if (!looping) { looping=true; lastT=performance.now(); requestAnimationFrame(frame); } }

let netAcc = 0;
function frame(t){
  const dt = Math.min(0.05, (t-lastT)/1000); lastT = t;
  const me = state.phase==='lobby' ? null : localStep(dt);
  if (isHost) { hostTick(dt); netAcc += dt; if (netAcc >= 0.05) { netAcc=0; broadcast(); } }
  else { sendAcc += dt; if (me && sendAcc >= 0.033 && hostConn && hostConn.open) { sendAcc=0;
      hostConn.send({ t:'in', x:Math.round(me.x), y:Math.round(me.y), ax:+me.ax.toFixed(3), ay:+me.ay.toFixed(3), fire:me.fire, act:me.act, vw:myView().w, vh:myView().h }); }
    for (const b of state.bullets) { b.x+=b.vx*dt; b.y+=b.vy*dt; }
    for (const p of state.players) { const k=Math.min(1,dt*12); p.dx+=(p.x-p.dx)*k; p.dy+=(p.y-p.dy)*k; } }
  if (state.phase!=='lobby') draw(me);
  requestAnimationFrame(frame);
}

    else if (!mp.out) { ctx.fillStyle='#6cf'; ctx.fillRect(bx,by,220*mp.sh/100,12); ctx.fillStyle='#e55'; ctx.fillRect(bx,by+18,220*mp.hp/100,12);
      ctx.fillStyle='#fff'; ctx.fillText(`シールド ${mp.sh}`, bx+4, by+10); ctx.fillText(`HP ${mp.hp}`, bx+4, by+28); }
    else { ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.fillText('脱落しました（味方を観戦中）', bx+4, by+20); } }
  const left = Math.max(0, MATCH_SEC - Math.floor((Date.now()+clockOffset-state.startAt)/1000));
  $('timer').textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  const humans = state.players.filter(p=>!p.bot).length, nT = new Set(state.players.filter(p=>!p.out).map(p=>teamOf(p.slot))).size;
  $('hud').innerHTML = `部屋 ${roomCode}｜${isHost?'ホスト':'参加者'}<br>人間 ${humans}人・BOT ${state.players.length-humans}人<br>残り ${nT}チーム${mp?`｜キル ${mp.kills}`:''}`;
  $('feed').innerHTML = (state.feed||[]).filter(f=>Date.now()+(isHost?0:clockOffset)-f.at<6000).map(f=>`<div>${esc(f.t)}</div>`).join('');
  if (state.phase==='end') { $('result').style.display='flex'; $('resTxt').textContent = `勝者：${state.winner}`;
    $('btnLobby').style.display=isHost?'block':'none'; $('resWait').style.display=isHost?'none':'block'; }
}

$('btnHost').onclick = () => { msg('部屋を作成中…'); startHost(); };
$('btnJoin').onclick = () => { msg('接続中…'); startJoin(); };
$('btnStart').onclick = hostStartMatch;
$('btnLobby').onclick = hostBackToLobby;
buildWorld('soltia');
</script>
</body>
